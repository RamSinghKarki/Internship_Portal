{% extends 'base.html' %}
{% block content %}

<h2 class="mb-4">Student Registration</h2>

<div class="card shadow-sm" style="max-width: 520px;">
  <div class="card-body">
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3"><label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">College</label>
            <select name="college_id" class="form-select" required>
                <option value="">-- select your college --</option>
                {% for c in colleges %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
            </select></div>
        <div class="mb-3"><label class="form-label">Roll Number</label>
            <input type="text" name="roll_number" class="form-control"></div>
        <div class="mb-3"><label class="form-label">Department</label>
            <input type="text" name="department" class="form-control" placeholder="e.g. Computer Science"></div>
        <div class="mb-3"><label class="form-label">Semester</label>
            <input type="number" name="semester" class="form-control" min="1" max="8"></div>
        <div class="mb-3"><label class="form-label">Skills</label>
            <input type="text" name="skills" class="form-control" placeholder="e.g. Python, MySQL"></div>
        <div class="mb-3"><label class="form-label">Documents (one PDF file)</label>
            <input type="file" name="document" class="form-control" accept=".pdf" required>
            <div class="form-text">
                Put your citizenship / NID, resume and any other documents
                (college ID card, certificates) together in <b>one PDF file</b>
                and upload it here. Companies read this file when you apply.
            </div></div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Register</button>
    </form>
  </div>
</div>

{% endblock %}
