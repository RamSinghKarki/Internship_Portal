{% extends 'base.html' %}
{% block content %}

<h2>Supervisor Registration</h2>

{% if companies|length == 0 %}
    <p class="flash">No companies are registered yet. A supervisor must belong to a company.</p>
{% else %}
<form class="box" method="POST">
    <label>Full Name</label>
    <input type="text" name="name" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <label>Company</label>
    <select name="company_id" required>
        {% for c in companies %}
            <option value="{{ c.id }}">{{ c.user.name }}</option>
        {% endfor %}
    </select>

    <label>Designation</label>
    <input type="text" name="designation" placeholder="e.g. Senior Developer">

    <label>Department</label>
    <input type="text" name="department" placeholder="e.g. IT">

    <button type="submit">Register</button>
</form>
{% endif %}

{% endblock %}
