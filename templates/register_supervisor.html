{% extends 'base.html' %}
{% block content %}

<h2 class="mb-4">Supervisor Registration</h2>

{% if companies|length == 0 %}
    <div class="alert alert-warning">No companies are registered yet. A supervisor must belong to a company.</div>
{% else %}
<div class="card shadow-sm" style="max-width: 520px;">
  <div class="card-body">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Company</label>
            <select name="company_id" class="form-select" required>
                {% for c in companies %}
                    <option value="{{ c.id }}">{{ c.user.name }}</option>
                {% endfor %}
            </select></div>
        <div class="mb-3"><label class="form-label">Designation</label>
            <input type="text" name="designation" class="form-control" placeholder="e.g. Senior Developer"></div>
        <div class="mb-3"><label class="form-label">Department</label>
            <input type="text" name="department" class="form-control" placeholder="e.g. IT"></div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Register</button>
    </form>
  </div>
</div>
{% endif %}

{% endblock %}
