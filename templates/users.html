{% extends 'base.html' %}
{% block content %}

<h2>All Users</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Joined</th>
        <th>Action</th>
    </tr>
    {% for u in users %}
    <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.name }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.role_name }}</td>
        <td>{{ u.created_at.strftime('%Y-%m-%d') }}</td>
        <td>
            {% if u.id != session.user_id %}
            <form method="POST" action="{{ url_for('delete_user', id=u.id) }}">
                <button type="submit" class="danger" onclick="return confirm('Delete this user and all their data?')">Delete</button>
            </form>
            {% endif %}
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
