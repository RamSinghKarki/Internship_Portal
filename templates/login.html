{% extends 'base.html' %}
{% block content %}

<h2 class="mb-4">Login</h2>

<div class="card shadow-sm" style="max-width: 460px;">
  <div class="card-body">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-box-arrow-in-right me-1"></i>Login</button>
    </form>
  </div>
</div>

<p class="mt-3">New here? <a href="{{ url_for('register') }}">Create an account</a></p>

{% endblock %}
