{% extends 'base.html' %}
{% block content %}

<h2 class="mb-4">Notifications</h2>

{% if items|length == 0 %}
    <p>No notifications yet.</p>
{% else %}
<div class="list-group shadow-sm">
    {% for n in items %}
    <a href="{{ n.link or '#' }}"
       class="list-group-item list-group-item-action {% if not n.is_read %}list-group-item-warning{% endif %}">
        <div class="d-flex w-90 justify-content-between">
            <span>{{ n.message }}</span>
            <small class="text-muted">{{ n.created_at.strftime('%Y-%m-%d %H:%M') }}</small>
        </div>
    </a>
    {% endfor %}
</div>
{% endif %}

{% endblock %}
