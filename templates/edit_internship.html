{% extends 'base.html' %}
{% block content %}

<h2>Edit Internship</h2>

<form class="box" method="POST">
    <label>Title</label>
    <input type="text" name="title" value="{{ internship.title }}" required>

    <label>Description</label>
    <textarea name="description" rows="4">{{ internship.description }}</textarea>

    <label>Required Skills</label>
    <input type="text" name="required_skills" value="{{ internship.required_skills }}">

    <label>Duration (weeks)</label>
    <input type="number" name="duration_weeks" value="{{ internship.duration_weeks }}" min="1">

    <label>Stipend</label>
    <input type="text" name="stipend" value="{{ internship.stipend }}">

    <label>Vacancies</label>
    <input type="number" name="vacancies" value="{{ internship.vacancies }}" min="1">

    <label>Status</label>
    <select name="status">
        <option value="open"   {% if internship.status == 'open'   %}selected{% endif %}>open</option>
        <option value="closed" {% if internship.status == 'closed' %}selected{% endif %}>closed</option>
    </select>

    <button type="submit">Save Changes</button>
</form>

{% endblock %}
