{% extends 'base.html' %}
{% block content %}

<h2 class="mb-4">Colleges</h2>

<div class="row g-4">
  <div class="col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">Add a College</h5>
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3"><label class="form-label">College Name</label>
                <input type="text" name="name" class="form-control" required></div>
            <div class="mb-3"><label class="form-label">Affiliation</label>
                <input type="text" name="affiliation" class="form-control" placeholder="e.g. Pokhara University"></div>
            <div class="mb-3"><label class="form-label">Address</label>
                <input type="text" name="address" class="form-control" placeholder="e.g. Dhangadhi, Kailali"></div>
            <button type="submit" class="btn btn-primary">Add College</button>
        </form>
      </div>
    </div>
  </div>

  <div class="col-lg-7">
    <div class="table-responsive">
    <table class="table table-bordered table-striped align-middle bg-white shadow-sm">
        <thead class="table-dark">
        <tr><th>#</th><th>College</th><th>Affiliation</th><th>Students</th><th>Action</th></tr>
        </thead>
        <tbody>
        {% for c in colleges %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.name }}<div class="small text-muted">{{ c.address }}</div></td>
            <td>{{ c.affiliation }}</td>
            <td><span class="badge bg-primary">{{ counts[c.id] }}</span></td>
            <td>
                <form method="POST" action="{{ url_for('delete_college', id=c.id) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn btn-outline-danger btn-sm"
                            onclick="return confirm('Remove this college? Students keep their accounts.')">Remove</button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    </div>
  </div>
</div>

{% endblock %}
