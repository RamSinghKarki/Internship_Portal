{% extends 'base.html' %}
{% block content %}

<h2 class="mb-4">Company Registration</h2>

<div class="card shadow-sm" style="max-width: 520px;">
  <div class="card-body">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label">Company Name</label>
            <input type="text" name="name" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Industry</label>
            <input type="text" name="industry" class="form-control" placeholder="e.g. Software, Banking"></div>
        <div class="mb-3"><label class="form-label">Location</label>
            <input type="text" name="location" class="form-control"></div>
        <div class="mb-3"><label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="3"></textarea></div>
        <button type="submit" class="btn btn-primary"><i class="bi bi-person-plus me-1"></i>Register</button>
    </form>
  </div>
</div>

{% endblock %}
