{% extends "base.html" %}
{% block title %}404 Not Found{% endblock %}
{% block breadcrumb %}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-3 fw-bold text-primary">404</h1>
  <p class="lead">The page you are looking for was not found.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house me-1"></i>Back to Dashboard</a>
</div>
{% endblock %}
{% block auth_content %}
<div class="login-page"><div class="text-center text-white">
  <h1 class="display-3 fw-bold">404</h1><p class="lead">Page not found.</p>
  <a href="{{ url_for('auth.login') }}" class="btn btn-light">Sign In</a>
</div></div>
{% endblock %}
