{% extends "base.html" %}
{% block title %}403 Forbidden{% endblock %}
{% block breadcrumb %}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-3 fw-bold text-primary">403</h1>
  <p class="lead">You don't have permission to access this page.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house me-1"></i>Back to Dashboard</a>
</div>
{% endblock %}
{% block auth_content %}
<div class="login-page"><div class="text-center text-white">
  <h1 class="display-3 fw-bold">403</h1><p class="lead">Access denied.</p>
  <a href="{{ url_for('auth.login') }}" class="btn btn-light">Sign In</a>
</div></div>
{% endblock %}
