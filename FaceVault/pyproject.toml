[project]
name = "facevault"
version = "0.1.0"
description = "Offline photo library manager with local face recognition (YuNet + SFace, no cloud)"
requires-python = ">=3.10"
dependencies = [
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
faiss = ["faiss-cpu>=1.7"]
dev = ["pytest>=7.0"]

[project.scripts]
facevault = "app.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "app",
    "app.ai",
    "app.database",
    "app.services",
    "app.themes",
    "app.utils",
    "app.views",
    "app.widgets",
    "app.workers",
]

[tool.setuptools.package-data]
"app.themes" = ["*.qss"]
